[project]
name = "speechforge"
# Calendar-free on purpose until the first rig deploy: 0.x means "the API may
# still move". The display version lives in src/speechforge/__init__.py.
version = "0.3.0"
description = "A small GPU speech server: Parakeet TDT speech-to-text and Chatterbox-Turbo streaming text-to-speech over ONNX Runtime, cooperating with StudioForge through its GPU lease API."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["speech", "tts", "stt", "onnxruntime", "openai-compatible", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# The server itself: no ONNX Runtime here, so the test suite and a client
# machine never pull 1+ GB of CUDA wheels. The rig installs the `gpu` extra.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "websockets>=13",
]

[project.optional-dependencies]
# The rig: ONNX Runtime with the CUDA execution provider, its CUDA 13 / cuDNN 9
# runtime as pip wheels (no system CUDA toolkit), the Parakeet front end, the
# Chatterbox tokenizer, the model downloader and NVML for the card-name check.
# >= 1.28: the CUDA 13 build (default from 1.27) with the preload_dlls() fix
# for NVIDIA's CUDA 13 wheel layout on Windows; also clear of 1.23.0's missing
# sm_120 code and of onnx-asr's exclusions (1.24.1, 1.25.*, 1.26.0). The upper
# bound is the newest release tested against (DECISIONS S4).
gpu = [
    "onnxruntime-gpu[cuda,cudnn]>=1.28,<1.32",
    "onnx-asr>=0.12",
    "tokenizers>=0.20",
    "huggingface-hub>=0.26",
    "nvidia-ml-py>=12.560",
]
# A CPU-only box that wants to run the real models (development, parity checks).
cpu = [
    "onnxruntime>=1.28,<1.32",
    "onnx-asr>=0.12",
    "tokenizers>=0.20",
    "huggingface-hub>=0.26",
]
# Phase-2 TTS bake-off: Qwen3-TTS through faster-qwen3-tts (PyTorch CUDA graphs).
# torch/torchaudio come from PyTorch's cu130 index (the PyPI Windows wheels are
# CPU-only), pinned as a matched pair: torchaudio is an import-time dependency
# of the qwen_tts package and its compiled extension must match torch. The pair
# is the newest with cu130 win_amd64 wheels for both (docs/ENGINES.md). Needs
# `voices.allow_reference_clip: true` (D3) and is installed ON TOP of `gpu`:
#     uv sync --extra gpu --extra tts-torch
tts-torch = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "faster-qwen3-tts>=0.5.4,<0.6",
    # qwen-tts-hf declares transformers >=5.15.1,<6, but 5.19 broke it (MimiConfig lost
    # rope_theta; measured on the host 2026-10-11) and 4.x lacks standardize_rope_params.
    # Only 5.15.1 is tested; widen after a smoke run.
    "transformers>=5.15.1,<5.16",
    "soundfile>=0.13",
]
# NVIDIA Nemotron Speech Streaming through sherpa-onnx (`stt.engine: nemotron`,
# docs/ENGINES.md). PyPI carries the CPU wheel only (it bundles its own ONNX
# Runtime). The CUDA wheel comes from k2-fsa's index as a local version
# (`sherpa-onnx==1.13.8+cuda12.cudnn9`, Windows x64 / Linux) and on Windows must
# live in a SEPARATE venv used by `stt.nemotron.backend: subprocess`: its CUDA 12
# ONNX Runtime DLLs share names with the CUDA 13 `gpu` extra's. >= 1.13.0 is the
# first release after the 160 ms exports this project pins (2026-04-25).
stt-nemotron = [
    "sherpa-onnx>=1.13.0,<1.14",
]
# The system-tray controller (`speechforge tray`, DECISIONS S23): pystray puts
# the icon in the notification area, Pillow draws it. Desktop host only; the
# module imports both lazily, so nothing else in the package needs them.
tray = [
    "pystray>=0.19",
    "pillow>=10",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-timeout>=2.3,<3",
    "ruff==0.16.3",
]

[project.scripts]
speechforge = "speechforge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechforge"]

[tool.uv]
# nvidia-cublas 13.8.1.7 shipped Linux wheels only; a lock that picks it cannot be
# installed on the Windows rig (`uv sync --extra gpu` fails before ONNX Runtime is
# even reached). Hold the resolver to a release with a win_amd64 wheel.
constraint-dependencies = ["nvidia-cublas!=13.8.1.7"]
# qwen-tts-hf (pulled by faster-qwen3-tts) requires the CPU `onnxruntime` wheel,
# which unpacks into the same `onnxruntime/` package directory as `onnxruntime-gpu`
# from the `gpu` extra: whichever installs last wins and the CUDA provider can
# vanish. `import onnxruntime` is satisfied by onnxruntime-gpu. Overrides are
# global, so every requirement on onnxruntime (qwen-tts-hf's and our own `cpu`
# extra's) becomes "the CPU wheel, only with the `cpu` extra": `--extra cpu` still
# gets it, `--extra gpu --extra tts-torch` never does. gradio is only used by the
# package's demo and would otherwise pin fastapi/starlette for the whole server.
override-dependencies = [
    "onnxruntime>=1.28,<1.32; extra == 'cpu'",
    "gradio; sys_platform == 'never'",
]

# PyTorch's CUDA 13.0 wheels. `explicit`: used only by the packages that name it
# below, and only when the `tts-torch` extra is selected; the default install and
# the `gpu` extra never see this index.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "tts-torch" }]
torchaudio = [{ index = "pytorch-cu130", extra = "tts-torch" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# The deny-list regexes read better on one line each.
"scripts/scrub_check.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120
markers = [
    "gpu: needs onnxruntime with the CUDA execution provider and the real models; skipped otherwise",
    "models: needs the real model files (SPEECHFORGE_TEST_MODELS); skipped otherwise",
]
filterwarnings = ["ignore::DeprecationWarning"]
