# SpeechForge configuration. Copy to <data dir>/config.yaml and edit. Every key
# is optional; shown values are the defaults unless marked "rig:".
#
# Secrets do NOT go here. They live beside it in speechforge.env, by name:
#   SPEECHFORGE_TOKEN   bearer token (`speechforge token new` writes it and shows it once;
#                       `speechforge token rotate` keeps the old one valid for 5 minutes)
#   SPEECHFORGE_SF_KEY  only if StudioForge has server.api_key set

server:
  hosts: ["127.0.0.1"]     # rig: add the machine's tailscale address (100.x.y.z). Never 0.0.0.0.
  port: 1236
  max_body_mb: 4
  tls_cert: null           # only for a non-tailnet address (e.g. the LAN); then tls_key too
  tls_key: null
  upgrades_per_ip_per_min: 10

gpu:
  provider: cuda
  devices: [3]             # PCI-bus order (StudioForge's numbering), preference order
  expect_name: ""          # rig: "3090"
  mem_limit_mb: 6144
  min_driver: 580          # R580: the CUDA 13 runtime the ORT wheels need

models:
  # dir: D:\SpeechForge\models   # default <data dir>/models
  tts_dtype: fp32          # fp16 only after the golden-audio + similarity check
  stt_quantization: null   # null = Parakeet fp32 (GPU)
  full_verify_days: 7      # full sha256 re-check of every model file at load after this long

tts:
  engine: chatterbox
  first_chunk_tokens: 15
  chunk_tokens: 25
  left_context: 8
  lookahead_tokens: 3
  prompt_s: 4.0
  max_http_streams: 1      # the HTTP utility route only
  qwen3:                   # read only with engine: qwen3-tts (docs/ENGINES.md). Needs the
    model: 1.7b            #   tts-torch extra and voices.allow_reference_clip: true (D3).
    dtype: bf16            # or fp16
    attn: sdpa             # flash_attention_2 only with a matching flash-attn wheel
    language: English      # or Chinese, Japanese, ..., Auto
    chunk_size: 8          # codec steps (12 per second) per streamed chunk
    max_seq_len: 2048      # static KV cache: reference codes + text + generated steps
    max_new_tokens: 1024   # ~85 s of audio
    temperature: 0.9
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.05
    xvec_only: false       # speaker embedding only: ignores transcripts, lower similarity
    append_silence: true   # 0.5 s of silence after the reference clip
  dots:                    # engine: dots-tts only (docs/ENGINES.md). Needs voices.allow_reference_clip (D3).
    backend: native        # native = dots_tts PyTorch runtime in-process; http = SGLang Omni server (WSL2), loopback only
    url: http://127.0.0.1:8000
    http_model: ""         # model name in the request; "" = the pinned repo id
    http_timeout_s: 30
    precision: bf16
    num_steps: 4           # MeanFlow checkpoint; null = artifact default (required for -2steps / -stts)
    guidance_scale: 1.2    # no effect on dots.tts-mf (CFG fused); null for fixed-step artifacts
    speaker_scale: 1.5
    eos_threshold: 0.8
    optimize: false        # torch.compile + warm-up at load (Triton); eager when off
    warmup_on_optimize: true
    max_generate_length: 500   # 160 ms patches (500 = 80 s)
    output_rate: 24000     # the model speaks 48 kHz; 24000 decimates to the sf.1 frame rate
    double_streaming: false    # incremental text on dots.tts-mf-2steps-stts (group tts-dots-stts)
    language: null         # null, auto_detect, or a language code
    normalize_text: false
    allow_missing_text_normalizer: true   # shim WeTextProcessing (no Windows wheels)

stt:
  engine: parakeet         # or nemotron: NVIDIA Nemotron Speech Streaming EN 0.6B (docs/ENGINES.md;
                           # weights under the NVIDIA Open Model License; needs the stt-nemotron extra)
  max_audio_s: 30          # the HTTP utility routes only
  nemotron:
    backend: auto          # auto = subprocess on Windows + cuda (sherpa-onnx's CUDA 12 ORT DLLs
                           # clash with the CUDA 13 onnxruntime-gpu in-process), else sherpa-onnx
    chunk_ms: 160          # fixed at export; the pinned export is the 160 ms one
    quantization: null     # null = fp32 export; int8 = the quantised export (CPU)
    num_threads: 2         # CPU provider only
    decoding: greedy_search
    tail_pad_ms: 480       # silence fed before the final so the last chunk flushes
    python: ""             # subprocess backend: interpreter of the venv holding the sherpa-onnx
                           # CUDA wheel (empty = this interpreter)
    worker_timeout_s: 120

eou:
  enabled: true            # Smart Turn v3.2 GPU at every >= min_pause_ms pause

realtime:
  max_sessions: 3
  partial_ms: 160
  min_pause_ms: 150
  max_tail_s: 8
  max_utterance_s: 60
  max_ingest_ratio: 1.25
  max_text_per_ctx: 2000
  max_text_per_min: 20000
  max_contexts: 2          # one active + one queued per session
  default_ahead_ms: 3000   # credit: how far TTS may run ahead of playback
  max_ahead_ms: 10000
  idle_close_s: 30
  resume_window_s: 10
  error_flood: 50          # errors in error_window_s -> close 1008
  error_window_s: 10
  voice_puts_per_hour: 30
  ready_wait_s: 20

voices:
  dir: null                # default %LOCALAPPDATA%\SpeechForge\voices (Windows), <data>/voices
  max_bytes: 2097152
  max_files: 256
  allow_reference_clip: false   # D3: reference clips stay on the box

selftest:
  enabled: true
  max_ttfa_ms: 250
  max_cancel_ms: 50
  max_stt_wer: 0.15
  max_roundtrip_wer: 0.25

residency:
  idle_unload_s: 900
  warm_on_boot: false
  drain_timeout_s: 15
  failure_cooldown_s: 60

studioforge:
  lease_mode: hold
  url: http://127.0.0.1:1234
  holder: speechforge
  priority: 2              # never displaces an idle tier-1 (chat) model
  vacate_url: ""           # default http://127.0.0.1:<port>/internal/vacate
  timeout_s: 5
  on_unreachable: proceed_if_free   # or refuse
  unreachable_min_free_gib: 8
  refusal_cooldown_s: 30
  touch_interval_s: 30
  vacate_cooldown_s: 180
